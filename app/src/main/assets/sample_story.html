<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #05070a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans Bengali', 'SolaimanLipi', 'Kalpurush', system-ui, -apple-system, sans-serif;
  }
  #stage-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

  canvas {
    background: #0b111e;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);

<script>

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Logical Full HD Vertical Resolution (9:16)
  const W = 1080;
  const H = 1920;
  canvas.width = W;
  canvas.height = H;

  // Responsive Viewport Scaling for Mobile/Desktop Screen Recording
  function resize() {
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    const targetRatio = W / H;
    const winRatio = ww / wh;
    let cw, ch;
    if (winRatio < targetRatio) {
      cw = ww;
      ch = ww / targetRatio;
    } else {
      ch = wh;
      cw = wh * targetRatio;
    }
    canvas.style.width = `${Math.floor(cw)}px`;
    canvas.style.height = `${Math.floor(ch)}px`;
  }
  window.addEventListener('resize', resize);
  resize();

  // Total Duration: 1 minute 12 seconds = 72.0 seconds
  const TOTAL_DURATION = 72.0;

  // Storyboard Beats (Precisely mapped to 72 seconds)
  const SCENES = [
    {

      caption: "শরীয়তপুরের ডামুড্যা উপজেলার কনেশ্বর ইউনিয়ন ভূমি অফিসে নামজারির জন্য ঘুষ গ্রহণ ও টাকা ফেরতের ঘটনায় দুদকের অভিযান।"
    },

      id: 2,

      sub: "ভুক্তভোগী: এমডি আওলাদ হোসেন",
      caption: "ভুক্তভোগী এমডি আওলাদ হোসেন অভিযোগ করেন, জমি কেনার পর নামজারির আবেদন করলে তাঁকে চার মাস ঘোরানো হয়।"
    },

      sub: "অভিযুক্ত: মো. শরীয়ত উল্লাহ (ইউনিয়ন ভূমি সহকারী কর্মকর্তা)",
      caption: "পরে এক সপ্তাহের মধ্যে কাজ করে দেওয়ার আশ্বাস দিয়ে ইউনিয়ন ভূমি সহকারী কর্মকর্তা মো. শরীয়ত উল্লাহ তাঁর কাছ থেকে ১০,৫০০ টাকা নেন।"

      caption: "বিষয়টি জানাজানি হলে ডিসিআর বাবদ ৩০০ টাকা রেখে বাকি ১০,২০০ টাকা গণমাধ্যমকর্মীদের উপস্থিতিতে ফেরত দেওয়া হয়।"
    },
    {

      caption: "অভিযানকালে অভিযুক্ত কর্মকর্তা টাকা ফেরতের কথা স্বীকার করেন। প্রাথমিক সত্যতা পাওয়ায় দুদকের প্রধান কার্যালয়ে প্রতিবেদন পাঠানো হবে।"
    },
    {
      id: 6,
      start: 61.0,
      end: 72.0,
      headline: "১৮ নভেম্বর তদন্তের নির্দেশ ইউএনও'র",
      sub: "মো. সালাহউদ্দিন আইয়ূবী, উপজেলা নির্বাহী কর্মকর্তা, ডামুড্যা",
      caption: "ডামুড্যা উপজেলা নির্বাহী কর্মকর্তা মো. সালাহউদ্দিন আইয়ূবী জানিয়েছেন, আগামী ১৮ নভেম্বর দুপক্ষকে ডেকে তদন্ত সাপেক্ষে রিপোর্ট দাখিল করা হবে।"
    }
  ];

  // Easing & Math Helpers
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    const x = clamp(t, 0, 1);
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  };

  // Helper: Draw Rounded Rect
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Helper: Wrap Bengali Text
  function drawWrappedText(text, x, y, maxWidth, lineHeight, align = 'center') {
    ctx.textAlign = align;
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && i > 0) {
        lines.push(line.trim());
        line = words[i] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line.trim());
    lines.forEach((l, idx) => {
      ctx.fillText(l, x, y + idx * lineHeight);
    });
    return lines.length;
  }

  // Shared Graphic Elements
  function drawGridBackground(time, tint = '#1e293b') {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#090e1a');
    grad.addColorStop(0.5, '#111a2e');
    grad.addColorStop(1, '#070b14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Subtle moving perspective grid
    ctx.save();
    ctx.strokeStyle = tint;
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = 1.5;
    const spacing = 72;
    const offset = (time * 18) % spacing;
    for (let x = 0; x <= W; x += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = offset; y <= H; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();

    // Cinematic Vignette
    const vig = ctx.createRadialGradient(W / 2, H / 2, 320, W / 2, H / 2, 1150);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(2,4,10,0.78)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // Vector Character Helper (Procedural Documentary Illustration)
  function drawPerson(x, y, scale, config = {}) {
    const {
      shirtColor = '#334155',
      tieColor = null,
      skinColor = '#d99b72',
      hairColor = '#1e293b',
      expression = 'neutral', // neutral, sad, greedy, serious, confident
      armAngleL = 0.2,
      armAngleR = -0.2,
      hasBadge = false,
      hasGlasses = false,
      holdingItem = null // 'money', 'file', 'mic', 'stamp'
    } = config;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 195, 78, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // Torso / Suit
    ctx.fillStyle = shirtColor;
    roundRect(-62, 35, 124, 155, 28);
    ctx.fill();

    // Collar / Tie
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.moveTo(-22, 35);
    ctx.lineTo(0, 68);
    ctx.lineTo(22, 35);
    ctx.closePath();
    ctx.fill();

    if (tieColor) {
      ctx.fillStyle = tieColor;
      ctx.beginPath();
      ctx.moveTo(-8, 52);
      ctx.lineTo(8, 52);
      ctx.lineTo(12, 138);
      ctx.lineTo(0, 152);
      ctx.lineTo(-12, 138);
      ctx.closePath();
      ctx.fill();
    }

    if (hasBadge) {
      // Official ID Card / Badge
      ctx.fillStyle = '#fbbf24';
      roundRect(22, 68, 28, 36, 4);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(26, 74, 20, 8);
      ctx.fillRect(26, 86, 14, 4);
    }

    // Neck
    ctx.fillStyle = skinColor;
    roundRect(-16, 12, 32, 32, 10);
    ctx.fill();

    // Head
    ctx.fillStyle = skinColor;
    roundRect(-38, -58, 76, 82, 34);
    ctx.fill();

    // Hair
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(0, -34, 40, Math.PI, 0, false);
    ctx.quadraticCurveTo(42, -20, 36, -15);
    ctx.quadraticCurveTo(10, -38, -36, -18);
    ctx.quadraticCurveTo(-42, -28, -38, -34);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(-15, -20, 4.5, 0, Math.PI * 2);
    ctx.arc(15, -20, 4.5, 0, Math.PI * 2);
    ctx.fill();

    // Eyebrows based on expression
    ctx.strokeStyle = hairColor;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (expression === 'sad') {
      ctx.moveTo(-24, -28); ctx.lineTo(-8, -33);
      ctx.moveTo(8, -33); ctx.lineTo(24, -28);
    } else if (expression === 'serious' || expression === 'greedy') {
      ctx.moveTo(-24, -33); ctx.lineTo(-8, -28);
      ctx.moveTo(8, -28); ctx.lineTo(24, -33);
    } else {
      ctx.moveTo(-24, -31); ctx.lineTo(-8, -31);
      ctx.moveTo(8, -31); ctx.lineTo(24, -31);
    }
    ctx.stroke();

    if (hasGlasses) {
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2.5;
      roundRect(-27, -28, 22, 16, 4);
      ctx.stroke();
      roundRect(5, -28, 22, 16, 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-5, -20);
      ctx.lineTo(5, -20);
      ctx.stroke();
    }

    // Mouth
    ctx.strokeStyle = '#7c2d12';
    ctx.lineWidth = 3;
    ctx.beginPath();
    if (expression === 'sad') {
      ctx.arc(0, 8, 12, Math.PI * 1.15, Math.PI * 1.85);
    } else if (expression === 'greedy' || expression === 'confident') {
      ctx.arc(0, -4, 13, Math.PI * 0.15, Math.PI * 0.85);
    } else {
      ctx.moveTo(-11, 2);
      ctx.lineTo(11, 2);
    }
    ctx.stroke();

    // Left Arm
    ctx.save();
    ctx.translate(-58, 52);
    ctx.rotate(armAngleL);
    ctx.fillStyle = shirtColor;
    roundRect(-14, 0, 28, 95, 14);
    ctx.fill();
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(0, 98, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Right Arm
    ctx.save();
    ctx.translate(58, 52);
    ctx.rotate(armAngleR);
    ctx.fillStyle = shirtColor;
    roundRect(-14, 0, 28, 95, 14);
    ctx.fill();
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(0, 98, 13, 0, Math.PI * 2);
    ctx.fill();

    if (holdingItem === 'file') {
      ctx.fillStyle = '#f59e0b';
      roundRect(-22, 85, 48, 60, 5);
      ctx.fill();
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(-16, 92, 36, 44);
    } else if (holdingItem === 'mic') {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-4, 65, 8, 45);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(0, 56, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NEWS', 0, 60);
    }
    ctx.restore();

    ctx.restore();
  }

  // Helper: Draw Banknote Bundle / Money
  function drawMoneyStack(x, y, scale = 1, label = '') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(-56, -24, 118, 62, 8);
    ctx.fill();

    // Layered notes
    for (let i = 2; i >= 0; i--) {
      ctx.fillStyle = i === 0 ? '#10b981' : '#059669';
      roundRect(-60 + i * 3, -30 + i * 3, 120, 58, 6);
      ctx.fill();
      ctx.strokeStyle = '#a7f3d0';
      ctx.lineWidth = 2;
      roundRect(-52 + i * 3, -22 + i * 3, 104, 42, 4);
      ctx.stroke();
    }

    // Center emblem & Taka symbol
    ctx.fillStyle = '#064e3b';
    ctx.beginPath();
    ctx.arc(0, -1, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ecfdf5';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('৳', 0, 7);

    // Paper Strap
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-14, -30, 28, 58);
    ctx.fillStyle = '#854d0e';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('BDT', 0, 4);

    if (label) {
      ctx.fillStyle = '#10b981';
      roundRect(-75, 38, 150, 34, 17);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(label, 0, 62);
    }
    ctx.restore();
  }

  // Helper: Draw Official Document / Mutation File
  function drawDocument(x, y, scale = 1, title = 'নামজারি ফাইল', stampText = '', stampColor = '#ef4444') {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(-78, -98, 168, 212, 10);
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    roundRect(-84, -106, 168, 212, 10);
    ctx.fill();

    // Header strip
    ctx.fillStyle = '#1e3a8a';
    roundRect(-84, -106, 168, 36, 10);
    ctx.fill();
    ctx.fillRect(-84, -84, 168, 14);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title, 0, -81);

    // Document Lines
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < 6; i++) {
      const w = i === 5 ? 85 : 132;
      roundRect(-66, -50 + i * 20, w, 8, 4);
      ctx.fill();
    }

    if (stampText) {
      ctx.save();
      ctx.translate(0, 35);
      ctx.rotate(-0.22);
      ctx.strokeStyle = stampColor;
      ctx.lineWidth = 4;
      roundRect(-62, -22, 124, 44, 6);
      ctx.stroke();
      ctx.fillStyle = stampColor;
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(stampText, 0, 7);
      ctx.restore();
    }

    ctx.restore();
  }

  // =========================================================================
  // SCENE 0 (0.0s - 10.5s): Map Zoom to Shariatpur -> Damudya -> Koneshwar Land Office + Bribe & Raid Overview
  // =========================================================================
  function renderScene0(t, localTime) {
    drawGridBackground(localTime, '#1d4ed8');

    const zoomP = easeInOutCubic(clamp(localTime / 3.8, 0, 1));
    const cardP = easeOutBack(clamp((localTime - 3.2) / 1.0, 0, 1));
    const alertP = easeOutCubic(clamp((localTime - 5.5) / 1.2, 0, 1));

    // 2.5D Regional Map Card
    ctx.save();
    ctx.translate(W / 2, 650);
    const mapScale = lerp(0.85, 1.12, zoomP);
    ctx.scale(mapScale, mapScale);

    // Map Frame
    ctx.fillStyle = '#0f172a';
    roundRect(-420, -290, 840, 580, 28);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Stylized Bangladesh / Shariatpur River & District Geometry
    ctx.save();
    roundRect(-410, -280, 820, 560, 24);
    ctx.clip();

    // Landmass
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-410, -280, 820, 560);

    // Padma / Meghna River Channels
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 38;
    ctx.beginPath();
    ctx.moveTo(-420, -180);
    ctx.bezierCurveTo(-120, -140, 80, -40, 420, 60);
    ctx.stroke();

    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(120, -280);
    ctx.bezierCurveTo(160, -80, 90, 120, 180, 290);
    ctx.stroke();

    // District Highlight Polygon (Shariatpur -> Damudya)
    ctx.fillStyle = 'rgba(239, 68, 68, 0.22)';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-120, -30);
    ctx.lineTo(60, -60);
    ctx.lineTo(110, 80);
    ctx.lineTo(-40, 140);
    ctx.lineTo(-150, 60);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Radar Pulse on Damudya - Koneshwar
    const pulse = (localTime * 1.4) % 1;
    ctx.strokeStyle = `rgba(239, 68, 68, ${1 - pulse})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(-20, 35, 20 + pulse * 95, 0, Math.PI * 2);
    ctx.stroke();

    // Location Pin
    const pinBounce = Math.abs(Math.sin(localTime * 4)) * 10;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(-20, 15 - pinBounce, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-36, 22 - pinBounce);
    ctx.lineTo(-4, 22 - pinBounce);

  // =========================================================================
  // BROADCAST NEWS OVERLAY CHROME (Top Header, Headline Banner, Subtitles, Timeline)
  // =========================================================================
  function renderNewsChrome(currentTime, currentScene) {
    // 1. Top Broadcast Header Bar
    ctx.fillStyle = 'rgba(9, 14, 26, 0.92)';
    ctx.fillRect(0, 0, W, 130);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 130);
    ctx.lineTo(W, 130);
    ctx.stroke();

    // Brand Badge: REPORTER HASAN
    const brandGrad = ctx.createLinearGradient(44, 34, 380, 96);
    brandGrad.addColorStop(0, '#dc2626');
    brandGrad.addColorStop(1, '#991b1b');
    ctx.fillStyle = brandGrad;
    roundRect(44, 34, 330, 62, 12);
    ctx.fill();

    // Pulsing Live Dot
    const dotAlpha = 0.55 + 0.45 * Math.sin(currentTime * 6);
    ctx.fillStyle = `rgba(255, 255, 255, ${dotAlpha})`;
    ctx.beginPath();
    ctx.arc(76, 65, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 27px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('REPORTER HASAN', 98, 75);

    // Right Location Pill
    ctx.fillStyle = '#1e293b';
    roundRect(630, 36, 406, 58, 12);
    ctx.fill();
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ডামুড্যা, শরীয়তপুর • বিশেষ প্রতিবেদন', 833, 73);

    // 2. Scene Headline Card (Upper Third)
    const sceneLocal = currentTime - currentScene.start;
    const headP = easeOutCubic(clamp(sceneLocal / 0.65, 0, 1));

    ctx.save();
    ctx.translate(0, (1 - headP) * -28);
    ctx.globalAlpha = headP;

    ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
    roundRect(44, 154, W - 88, 138, 20);
    ctx.fill();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Left Accent Bar
    ctx.fillStyle = '#f59e0b';
    roundRect(44, 154, 14, 138, 7);
    ctx.fill();

    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(currentScene.headline, 82, 212);

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '25px sans-serif';
    ctx.fillText(currentScene.sub, 82, 260);
    ctx.restore();

    // 3. Bottom Synchronized Voiceover Caption Card (Lower Third)
    ctx.fillStyle = 'rgba(6, 10, 20, 0.95)';
    roundRect(44, H - 355, W - 88, 255, 24);
    ctx.fill();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Scene Indicator Pill
    ctx.fillStyle = '#0284c7';
    roundRect(74, H - 332, 165, 38, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`দৃশ্য ০${currentScene.id + 1} / ০${SCENES.length}`, 156, H - 306);

    // Timecode Indicator
    const mins = Math.floor(currentTime / 60);
    const secs = Math.floor(currentTime % 60).toString().padStart(2, '0');
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`${mins}:${secs} / 1:12`, W - 78, H - 305);

    // Caption Text
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 31px sans-serif';
    drawWrappedText(currentScene.caption, W / 2, H - 245, W - 150, 46, 'center');

    // 4. Bottom Story Progress Bar (72s Timeline)
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, H - 18, W, 18);

    const totalProgress = clamp(currentTime / TOTAL_DURATION, 0, 1);
    const progGrad = ctx.createLinearGradient(0, 0, W, 0);
    progGrad.addColorStop(0, '#ef4444');
    progGrad.addColorStop(0.5, '#f59e0b');
    progGrad.addColorStop(1, '#10b981');
    ctx.fillStyle = progGrad;
    ctx.fillRect(0, H - 18, W * totalProgress, 18);

    // Scene Tick Markers
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    SCENES.forEach(s => {
      if (s.start > 0) {
        const tx = (s.start / TOTAL_DURATION) * W;
        ctx.fillRect(tx - 1.5, H - 18, 3, 18);
      }
    });
  }

  // =========================================================================
  // MAIN ANIMATION LOOP (30+ FPS Target, Self-Contained 72.0s Playback)
  // =========================================================================
  let startTime = null;

  function renderFrame(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = (timestamp - startTime) / 1000;
    const currentTime = Math.min(elapsed, TOTAL_DURATION);

    // Find active scene
    let activeScene = SCENES[SCENES.length - 1];
    for (let i = 0; i < SCENES.length; i++) {
      if (currentTime >= SCENES[i].start && currentTime < SCENES[i].end) {
        activeScene = SCENES[i];
        break;
      }
    }

    const sceneDuration = activeScene.end - activeScene.start;
    const localTime = Math.max(0, currentTime - activeScene.start);
    const sceneProgress = clamp(localTime / sceneDuration, 0, 1);

    // Smooth Scene Transition (Cross-dissolve / Subtle Scale)
    const fadeIn = clamp(localTime / 0.45, 0, 1);
    const fadeOut = currentTime < TOTAL_DURATION - 0.5
      ? clamp((activeScene.end - currentTime) / 0.35, 0, 1)
      : 1;

    ctx.save();
    ctx.globalAlpha = Math.min(fadeIn, fadeOut);

    switch (activeScene.id) {
      case 0: renderScene0(sceneProgress, localTime); break;
      case 1: renderScene1(sceneProgress, localTime); break;
      case 2: renderScene2(sceneProgress, localTime); break;
      case 3: renderScene3(sceneProgress, localTime); break;
      case 4: renderScene4(sceneProgress, localTime); break;
      case 5: renderScene5(sceneProgress, localTime); break;
      case 6: renderScene6(sceneProgress, localTime); break;
    }
    ctx.restore();

    // Render Persistent Documentary Chrome & Subtitles
    renderNewsChrome(currentTime, activeScene);

    if (elapsed < TOTAL_DURATION) {
      requestAnimationFrame(renderFrame);
    }
  }

  // Tap/Click anywhere to restart playback cleanly if needed
  canvas.addEventListener('click', () => {
    startTime = performance.now();
    requestAnimationFrame(renderFrame);
  });

  requestAnimationFrame(renderFrame);
})();
